# OpenSim tools, built by apt-package from build/opensim-tools, prepared by
# packaging/build (packaging/stage). ${VERSION} comes from the git tag. The
# projects of packaging/siblings come from their own packages, linked into the
# vendor folder.
# The tools in /usr/share/opensim-tools, the opensim command, the service
# account and the system layout: config in /etc/opensim, data in
# /var/lib/opensim, logs in /var/log/opensim, cache in /var/cache/opensim,
# created on install. The OpenSimulator releases come in their own packages
# (opensim-<version>), each one registered as an install profile.
name: opensim-tools
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: net
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  OpenSimulator installation and management tools
  Installs and runs OpenSimulator grids and regions with the files at the
  standard places: config in /etc/opensim, data in /var/lib/opensim, logs
  and cache in /var. The opensim command starts, stops and monitors the
  instances; opensim setup creates grids. Works with the packaged
  OpenSimulator releases or any other one.
homepage: https://github.com/GuduleLapointe/opensim-debian
license: AGPL-3.0-or-later

depends:
  - adduser
  - bash-tools (>= ${BASH_TOOLS_VERSION})
  - bsdextrautils | bsdmainutils
  - crudini
  - curl
  - default-mysql-client | virtual-mysql-client
  - opensim-engine
  - opensim-helpers
  - opensim-rest-php
  - php-cli (>= 2:8.2)
  - php-curl
  - php-intl
  - php-mbstring
  - php-mysql
  - php-xml
  - procps
  - screen
  - sudo
# OpenSim needs a MySQL or MariaDB server, on this machine or another one
recommends:
  - default-mysql-server | virtual-mysql-server
  - uuid-runtime
suggests:
  - opensim

contents:
  - src: build/opensim-tools
    dst: /usr/share/opensim-tools
    type: tree
  - src: /usr/share/opensim-tools/bin/opensim
    dst: /usr/bin/opensim
    type: symlink
  - src: /usr/share/opensim-engine
    dst: /usr/share/opensim-tools/vendor/magicoli/opensim-engine
    type: symlink
  - src: /usr/share/opensim-helpers
    dst: /usr/share/opensim-tools/vendor/magicoli/opensim-helpers
    type: symlink
  - src: /usr/share/opensim-rest-php
    dst: /usr/share/opensim-tools/vendor/magicoli/opensim-rest-php
    type: symlink
  - src: packaging/opensim.service
    dst: /usr/lib/systemd/system/opensim.service
    file_info:
      mode: 0644
  - src: share/bash_completion.d/opensim
    dst: /usr/share/bash-completion/completions/opensim
    file_info:
      mode: 0644
  - src: packaging/opensim-tools.copyright
    dst: /usr/share/doc/opensim-tools/copyright
    file_info:
      mode: 0644
  - src: packaging/opensim-tools.README.Debian
    dst: /usr/share/doc/opensim-tools/README.Debian
    file_info:
      mode: 0644
  # The system layout, owned by opensim through dpkg-statoverride (postinst);
  # dpkg keeps them, and says so, while they hold config, data or logs
  - dst: /etc/opensim
    type: dir
  - dst: /etc/opensim/grids
    type: dir
  - dst: /etc/opensim/opensim.d
    type: dir
  - dst: /etc/opensim/robust.d
    type: dir
  - dst: /var/lib/opensim
    type: dir
  - dst: /var/lib/opensim/data
    type: dir
  - dst: /var/log/opensim
    type: dir
  - dst: /var/cache/opensim
    type: dir

scripts:
  preinstall: packaging/opensim-tools.preinst
  postinstall: packaging/opensim-tools.postinst
  preremove: packaging/opensim-tools.prerm
  postremove: packaging/opensim-tools.postrm

deb:
  # The OpenSimulator releases installed or removed, to update their profiles
  triggers:
    interest_noawait:
      - /usr/share/opensim
