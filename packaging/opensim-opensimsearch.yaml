# OpenSimSearch module for an OpenSimulator release or unstable, built by
# apt-package from build/modules/opensimsearch with the versions
# packaging/build gives (packaging/opensim-modules.versions). Installed in its
# own folder: not loaded until enabled.
name: opensim-${MODULES_CORE}-opensimsearch
arch: all
platform: linux
version: ${OPENSIMSEARCH_VERSION}
release: ${OPENSIMSEARCH_REVISION}
version_schema: none
section: net
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  OpenSimSearch module for OpenSimulator ${MODULES_CORE}
  In-world search of places, land for sale, events and classifieds, with a
  web search engine. Installed in
  /usr/share/opensim-modules/${MODULES_CORE}/opensimsearch, not loaded until
  enabled.
homepage: https://github.com/GuduleLapointe/OpenSimSearch
license: BSD-3-Clause

# The module keeps nothing in a database: it queries a search web service
# (its web part is another package). No dependency on the core package: a
# build of the same OpenSimulator version made elsewhere can use the module
suggests:
  - opensim-${MODULES_CORE}

contents:
  - src: build/modules/opensimsearch
    dst: /usr/share/opensim-modules/${MODULES_CORE}/opensimsearch
    type: tree
  - src: packaging/opensim-opensimsearch.copyright
    dst: /usr/share/doc/opensim-${MODULES_CORE}-opensimsearch/copyright
    file_info:
      mode: 0644
