# The default site of a grid: its document root, whose index.php hands every URL it has no file for to the
# helpers. Built by apt-package from share/web of this repository. ${VERSION} comes from the git tag.
name: opensim-web
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: web
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  Default web site for an OpenSimulator grid
  The document root of the site, /var/www/html: what it has no file for is
  answered by the helpers (opensim-helpers), the home and splash pages, the
  services at the URLs of the grid. Put your own files next to its index.php.
homepage: https://github.com/GuduleLapointe/opensim-debian
license: AGPL-3.0-or-later

depends:
  - opensim-helpers
suggests:
  - caddy | nginx | apache2
  - php-fpm | libapache2-mod-php

contents:
  - src: share/web
    dst: /var/www/html
    type: tree
